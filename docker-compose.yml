services:
  db:
    image: postgres:15-alpine
    container_name: culturalcms_db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-CulturalCMSDb}"
    ports:
    - "${DB_PORT:-5432}:5432"
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build: .
    container_name: culturalcms-app
    ports:
     - "${APP_PORT:-8080}:8080"
    environment:
      Jwt__Issuer: "${JWT_ISSUER:-https://localhost:8080}"
      Jwt__Audience: "${JWT_AUDIENCE:-https://localhost:8080}"
      Jwt__Secret: "${JWT_SECRET}"
      Cors__Origin: "${CORS_ORIGIN:-http://localhost:3000}"
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./CulturalCMS.API/wwwroot/uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./cultural-cms-frontend
      args:
        VITE_API_URL: "http://localhost:${APP_PORT:-8080}/api/v1"
    container_name: culturalcms-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - webapp

volumes:
  postgres-data:
